name: Deploy Vite Project Strict

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean Install Dependencies
        run: |
          npm set progress=false
          npm install --no-audit --no-fund --loglevel error --legacy-peer-deps

      - name: Fix Rollup Linux Issue
        run: npm i @rollup/rollup-linux-x64-gnu --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Verify Build Output
        run: |
          # Yeh check karega ki dist folder bana ya nahi aur .jsx file .js bani ya nahi
          ls -la dist
          ls -la dist/assets || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
